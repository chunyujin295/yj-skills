<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{PAGE_TITLE}} - 实人认证平台</title>
  <link rel="stylesheet" href="https://unpkg.com/element-ui@2.15.8/lib/theme-chalk/index.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div class="app-container">
      <!-- 搜索栏 -->
      <el-form :model="queryParams" ref="queryForm" :inline="true" size="small">
        <el-form-item label="关键词">
          <el-input v-model="queryParams.keyword" placeholder="请输入" clearable
                    style="width: 240px" @keyup.enter.native="handleSearch"></el-input>
        </el-form-item>
        <el-form-item>
          <el-button type="primary" icon="el-icon-search" @click="handleSearch">查询</el-button>
          <el-button icon="el-icon-refresh" @click="handleReset">重置</el-button>
        </el-form-item>
      </el-form>

      <!-- 操作栏 -->
      <el-row :gutter="10" class="mb8">
        <el-col :span="1.5">
          <el-button type="primary" icon="el-icon-plus" size="mini" @click="handleAdd">新增</el-button>
        </el-col>
        <el-col :span="1.5">
          <el-button icon="el-icon-download" size="mini" @click="handleExport">导出</el-button>
        </el-col>
      </el-row>

      <!-- 数据表格 -->
      <div class="table-wrap">
          <el-table :data="tableData" border stripe style="width: 100%">
          <el-table-column label="ID" prop="id" width="80"></el-table-column>
          <el-table-column label="名称" prop="name" min-width="160"></el-table-column>
          <el-table-column label="状态" prop="status" width="120">
            <template slot-scope="scope">
              <el-tag :type="scope.row.status === '启用' ? 'success' : 'danger'" size="small" effect="plain">
                {{ scope.row.status }}
              </el-tag>
            </template>
          </el-table-column>
          <el-table-column label="创建时间" prop="createTime" width="180"></el-table-column>
          <el-table-column label="操作" width="180" fixed="right">
            <template slot-scope="scope">
              <el-button type="text" size="mini" @click="handleEdit(scope.row)">编辑</el-button>
              <el-button type="text" size="mini" style="color:#ff4949" @click="handleDelete(scope.row)">删除</el-button>
            </template>
          </el-table-column>
        </el-table>
      </div>

      <!-- 分页 -->
      <div class="pagination-container">
        <el-pagination background layout="total, sizes, prev, pager, next, jumper"
                       :total="total" :page-sizes="[10, 20, 50]"
                       :page-size.sync="queryParams.pageSize"
                       :current-page.sync="queryParams.pageNum">
        </el-pagination>
      </div>
    </div>

    <!-- 新增/编辑弹窗 -->
    <el-dialog :title="dialogTitle" :visible.sync="dialogVisible" width="600px" :close-on-click-modal="false">
      <el-form :model="form" :rules="rules" ref="form" label-width="120px" size="small">
        <el-form-item label="名称" prop="name">
          <el-input v-model="form.name" placeholder="请输入名称" style="width:300px;"></el-input>
        </el-form-item>
        <el-form-item label="状态" prop="status">
          <el-select v-model="form.status" placeholder="请选择状态" style="width:300px;">
            <el-option label="启用" value="启用"></el-option>
            <el-option label="禁用" value="禁用"></el-option>
          </el-select>
        </el-form-item>
      </el-form>
      <span slot="footer">
        <el-button size="small" @click="dialogVisible = false">取消</el-button>
        <el-button type="primary" size="small" @click="handleSave">保存</el-button>
      </span>
    </el-dialog>
  </div>

  <script src="https://unpkg.com/vue@2.6.14/dist/vue.js"></script>
  <script src="https://unpkg.com/element-ui@2.15.8/lib/index.js"></script>
  <script>
    new Vue({
      el: '#app',
      data() {
        return {
          queryParams: { keyword: '', pageNum: 1, pageSize: 10 },
          tableData: [
            { id: 1, name: '示例数据一', status: '启用', createTime: '2026-05-20 09:30:00' },
            { id: 2, name: '示例数据二', status: '启用', createTime: '2026-05-20 10:15:00' },
            { id: 3, name: '示例数据三', status: '禁用', createTime: '2026-05-21 11:20:00' },
            { id: 4, name: '示例数据四', status: '启用', createTime: '2026-05-22 14:05:00' },
            { id: 5, name: '示例数据五', status: '禁用', createTime: '2026-05-23 16:40:00' }
          ],
          total: 5,
          dialogVisible: false,
          dialogTitle: '',
          form: {},
          rules: {
            name: [{ required: true, message: '请输入名称', trigger: 'blur' }]
          }
        }
      },
      methods: {
        handleSearch() { this.$message.success('查询条件已应用'); },
        handleReset() { this.$message.info('已重置查询条件'); },
        handleAdd() {
          this.dialogTitle = '新增{{MODULE_LABEL}}';
          this.form = { name: '', status: '启用' };
          this.dialogVisible = true;
        },
        handleEdit(row) {
          this.dialogTitle = '编辑{{MODULE_LABEL}}';
          this.form = { ...row };
          this.dialogVisible = true;
        },
        handleSave() {
          if (!this.form.name) { this.$message.warning('请填写必填项'); return; }
          this.$message.success('保存成功');
          this.dialogVisible = false;
        },
        handleDelete(row) {
          this.$confirm('确认删除 ' + row.name + '？', '警告', { type: 'warning' })
            .then(() => { this.$message.success('删除成功'); })
            .catch(() => {});
        },
        handleExport() { this.$message.success('正在导出...'); }
      }
    })
  </script>
</body>
</html>
