<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - {{PROJECT_NAME}}</title>
  <link rel="stylesheet" href="https://unpkg.com/element-ui@2.15.8/lib/theme-chalk/index.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Helvetica Neue", Helvetica, "PingFang SC", "Hiragino Sans GB",
                   "Microsoft YaHei", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .login-container {
      width: 400px;
      padding: 40px;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
    }
    .login-title {
      text-align: center;
      margin-bottom: 30px;
      font-size: 24px;
      font-weight: 600;
      color: #303133;
    }
    .login-title img {
      height: 40px;
      margin-bottom: 10px;
    }
    .login-form .el-input {
      height: 40px;
    }
    .login-form .el-input__inner {
      height: 40px;
      line-height: 40px;
    }
    .login-form .el-form-item {
      margin-bottom: 22px;
    }
    .login-btn {
      width: 100%;
      height: 44px;
      font-size: 16px;
    }
    .login-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
    }
    .login-footer {
      text-align: center;
      margin-top: 20px;
      color: #909399;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="login-container">
      <div class="login-title">
        <div>{{PROJECT_NAME}}</div>
      </div>
      <el-form ref="loginForm" :model="loginForm" :rules="loginRules" class="login-form">
        <el-form-item prop="username">
          <el-input v-model="loginForm.username" placeholder="请输入用户名" prefix-icon="el-icon-user"
                    @keyup.enter.native="handleLogin"></el-input>
        </el-form-item>
        <el-form-item prop="password">
          <el-input v-model="loginForm.password" type="password" placeholder="请输入密码"
                    prefix-icon="el-icon-lock" show-password
                    @keyup.enter.native="handleLogin"></el-input>
        </el-form-item>
        <div class="login-options">
          <el-checkbox v-model="loginForm.rememberMe">记住密码</el-checkbox>
        </div>
        <el-button :loading="loading" type="primary" class="login-btn" @click="handleLogin">
          登 录
        </el-button>
      </el-form>
      <div class="login-footer">
        Copyright © 2024 {{PROJECT_NAME}} All Rights Reserved.
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/vue@2.6.14/dist/vue.js"></script>
  <script src="https://unpkg.com/element-ui@2.15.8/lib/index.js"></script>
  <script>
    new Vue({
      el: '#app',
      data() {
        return {
          loading: false,
          loginForm: {
            username: '',
            password: '',
            rememberMe: false
          },
          loginRules: {
            username: [{ required: true, message: '请输入用户名', trigger: 'blur' }],
            password: [{ required: true, message: '请输入密码', trigger: 'blur' }]
          }
        }
      },
      methods: {
        handleLogin() {
          this.$refs.loginForm.validate((valid) => {
            if (!valid) return;
            this.loading = true;
            // 调用登录 API
            setTimeout(() => {
              this.loading = false;
              this.$message.success('登录成功');
            }, 1000);
          });
        }
      }
    })
  </script>
</body>
</html>
