<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{PAGE_TITLE}} - 实人认证平台</title>
  <link rel="stylesheet" href="https://unpkg.com/element-ui@2.15.8/lib/theme-chalk/index.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div class="app-container">
      <el-tabs v-model="activeTab" type="border-card">
        <el-tab-pane label="认证配置" name="auth">
          <el-form :model="form.auth" :rules="rules.auth" ref="authForm" label-width="140px" size="small" class="config-form">
            <el-row :gutter="24">
              <el-col :span="12">
                <el-form-item label="认证有效期" prop="expireMinutes">
                  <el-input-number v-model="form.auth.expireMinutes" :min="1" :max="1440" style="width: 220px;"></el-input-number>
                  <span class="form-unit">分钟</span>
                </el-form-item>
              </el-col>
              <el-col :span="12">
                <el-form-item label="最大重试次数" prop="maxRetry">
                  <el-input-number v-model="form.auth.maxRetry" :min="1" :max="10" style="width: 220px;"></el-input-number>
                  <span class="form-unit">次</span>
                </el-form-item>
              </el-col>
              <el-col :span="12">
                <el-form-item label="活体检测">
                  <el-switch v-model="form.auth.livenessEnabled" active-text="启用" inactive-text="停用"></el-switch>
                </el-form-item>
              </el-col>
              <el-col :span="12">
                <el-form-item label="相似度阈值" prop="threshold">
                  <el-input-number v-model="form.auth.threshold" :min="0" :max="100" style="width: 220px;"></el-input-number>
                  <span class="form-unit">%</span>
                </el-form-item>
              </el-col>
            </el-row>
          </el-form>
        </el-tab-pane>

        <el-tab-pane label="存储配置" name="storage">
          <el-form :model="form.storage" :rules="rules.storage" ref="storageForm" label-width="140px" size="small" class="config-form">
            <el-row :gutter="24">
              <el-col :span="12">
                <el-form-item label="存储类型" prop="type">
                  <el-select v-model="form.storage.type" placeholder="请选择" style="width: 260px;">
                    <el-option label="本地存储" value="local"></el-option>
                    <el-option label="对象存储" value="oss"></el-option>
                  </el-select>
                </el-form-item>
              </el-col>
              <el-col :span="12">
                <el-form-item label="保留天数" prop="retentionDays">
                  <el-input-number v-model="form.storage.retentionDays" :min="1" :max="3650" style="width: 220px;"></el-input-number>
                  <span class="form-unit">天</span>
                </el-form-item>
              </el-col>
              <el-col :span="12">
                <el-form-item label="访问地址" prop="endpoint">
                  <el-input v-model="form.storage.endpoint" placeholder="请输入访问地址" style="width: 320px;"></el-input>
                </el-form-item>
              </el-col>
              <el-col :span="12">
                <el-form-item label="自动清理">
                  <el-switch v-model="form.storage.autoClean" active-text="启用" inactive-text="停用"></el-switch>
                </el-form-item>
              </el-col>
            </el-row>
          </el-form>
        </el-tab-pane>

        <el-tab-pane label="通知配置" name="notify">
          <el-form :model="form.notify" :rules="rules.notify" ref="notifyForm" label-width="140px" size="small" class="config-form">
            <el-row :gutter="24">
              <el-col :span="12">
                <el-form-item label="邮件服务地址" prop="smtpHost">
                  <el-input v-model="form.notify.smtpHost" placeholder="请输入 SMTP 地址" style="width: 320px;"></el-input>
                </el-form-item>
              </el-col>
              <el-col :span="12">
                <el-form-item label="邮件端口" prop="smtpPort">
                  <el-input-number v-model="form.notify.smtpPort" :min="1" :max="65535" style="width: 220px;"></el-input-number>
                </el-form-item>
              </el-col>
              <el-col :span="12">
                <el-form-item label="短信签名" prop="smsSign">
                  <el-input v-model="form.notify.smsSign" placeholder="请输入短信签名" style="width: 320px;"></el-input>
                </el-form-item>
              </el-col>
              <el-col :span="12">
                <el-form-item label="失败告警">
                  <el-switch v-model="form.notify.alertEnabled" active-text="启用" inactive-text="停用"></el-switch>
                </el-form-item>
              </el-col>
            </el-row>
          </el-form>
        </el-tab-pane>
      </el-tabs>

      <div class="form-actions">
        <el-button type="primary" size="small" @click="handleSave">保存配置</el-button>
        <el-button size="small" @click="handleReset">重置</el-button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/vue@2.6.14/dist/vue.js"></script>
  <script src="https://unpkg.com/element-ui@2.15.8/lib/index.js"></script>
  <script>
    new Vue({
      el: '#app',
      data() {
        return {
          activeTab: 'auth',
          form: {
            auth: {
              expireMinutes: 30,
              maxRetry: 3,
              livenessEnabled: true,
              threshold: 80
            },
            storage: {
              type: 'local',
              retentionDays: 180,
              endpoint: '/data/auth-files',
              autoClean: true
            },
            notify: {
              smtpHost: 'smtp.example.com',
              smtpPort: 465,
              smsSign: '实人认证',
              alertEnabled: true
            }
          },
          rules: {
            auth: {
              expireMinutes: [{ required: true, message: '请输入认证有效期', trigger: 'blur' }],
              maxRetry: [{ required: true, message: '请输入最大重试次数', trigger: 'blur' }],
              threshold: [{ required: true, message: '请输入相似度阈值', trigger: 'blur' }]
            },
            storage: {
              type: [{ required: true, message: '请选择存储类型', trigger: 'change' }],
              retentionDays: [{ required: true, message: '请输入保留天数', trigger: 'blur' }],
              endpoint: [{ required: true, message: '请输入访问地址', trigger: 'blur' }]
            },
            notify: {
              smtpHost: [{ required: true, message: '请输入邮件服务地址', trigger: 'blur' }],
              smtpPort: [{ required: true, message: '请输入邮件端口', trigger: 'blur' }],
              smsSign: [{ required: true, message: '请输入短信签名', trigger: 'blur' }]
            }
          }
        }
      },
      methods: {
        handleSave() {
          const refName = this.activeTab + 'Form';
          this.$refs[refName].validate((valid) => {
            if (!valid) return;
            this.$message.success('保存成功');
          });
        },
        handleReset() {
          const refName = this.activeTab + 'Form';
          this.$refs[refName].resetFields();
          this.$message.info('已重置');
        }
      }
    })
  </script>
</body>
</html>
